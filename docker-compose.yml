version: "3.8"
services:
  event-bus:
    image: selenium/event-bus:4.38.0
    container_name: selenium-event-bus
    networks: ["selenium-grid"]
    ports:
      - "4443:4443"
      - "5557:5557"

  sessions:
    image: selenium/sessions:4.38.0
    container_name: selenium-sessions
    networks: ["selenium-grid"]
    environment:
      - SE_EVENT_BUS_HOST=event-bus
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    depends_on:
      - event-bus

  session-queue:
    image: selenium/session-queue:4.38.0
    container_name: selenium-session-queue
    networks: ["selenium-grid"]
    environment:
      - SE_EVENT_BUS_HOST=event-bus
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    depends_on:
      - event-bus

  distributor:
    image: selenium/distributor:4.38.0
    container_name: selenium-distributor
    networks: ["selenium-grid"]
    ports:
      - "5553:5553"
    environment:
      - SE_EVENT_BUS_HOST=event-bus
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_SESSIONS_MAP_HOST=sessions
      - SE_SESSION_QUEUE_HOST=session-queue
    depends_on:
      - event-bus
      - session-queue
      - sessions

  router:
    image: selenium/router:4.38.0
    container_name: selenium-router
    networks: ["selenium-grid"]
    privileged: true
    ports:
      - "4444:4444" # Grid UI & WebDriver endpoint
    environment:
      - SE_EVENT_BUS_HOST=event-bus
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_SESSIONS_MAP_HOST=sessions
      - SE_SESSION_QUEUE_HOST=session-queue
      - SE_DISTRIBUTOR_HOST=distributor
      - SE_DISTRIBUTOR_PORT=5553
    depends_on:
      - event-bus
      - distributor

  node-docker:
    image: selenium/node-docker:4.38.0
    container_name: selenium-node-docker
    networks: ["selenium-grid"]
    privileged: true
    volumes:
      - ./config.toml:/opt/selenium/docker.toml:ro
      - ./assets:/opt/selenium/assets
      - /var/run/docker.sock:/var/run/docker.sock # <<-- bắt buộc để node-docker spawn containers
    environment:
      - SE_EVENT_BUS_HOST=event-bus
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=50
      # Cho phép noVNC (Live View) không yêu cầu password (xem phần giải thích)
      - SE_VNC_NO_PASSWORD=true
      - SE_NODE_DOCKER_CONFIG_FILENAME=docker.toml
    depends_on:
      - event-bus
      - router

networks:
  selenium-grid:
    driver: bridge
